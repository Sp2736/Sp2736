name: notify-profile-on-deploy

# ─────────────────────────────────────────────────────────────
#  HOW TO USE IN OTHER REPOSITORIES
#  Copy this file to .github/workflows/notify-profile.yml in
#  any repo that deploys to GitHub Pages. When a gh-pages push
#  completes it fires a repository_dispatch to Sp2736/Sp2736
#  which triggers update-profile.yml to re-scan deploys and
#  refresh the README.
#
#  Required secret in the other repo:
#    PROFILE_TOKEN  — a classic PAT with repo scope on Sp2736/Sp2736
#                     (the same token used in this profile repo)
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches: [gh-pages]

jobs:
  ping-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch profile refresh
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PROFILE_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Sp2736/Sp2736/dispatches \
            -d '{"event_type":"project-deployed","client_payload":{"repo":"${{ github.repository }}"}}'

