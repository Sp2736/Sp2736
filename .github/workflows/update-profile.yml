name: update-profile
on:
  schedule:
    - cron: "30 0 * * *"    # 06:00 IST - morning quote
    - cron: "30 15 * * *"   # 21:00 IST - night quote
    - cron: "15 */6 * * *"  # stats + gh-pages deploy scan
  workflow_dispatch:
  repository_dispatch:
    types: [project-deployed]
permissions:
  contents: write
concurrency: update-profile
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/update.py
        env:
          GH_USER: Sp2736
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          MASTERYOS_STATS_URL: ${{ vars.MASTERYOS_STATS_URL }}
      - run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: refresh profile" && git push)
